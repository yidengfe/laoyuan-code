<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>企业后台管理系统</h1>
    <a href="/logout">退出</a>
  </header>

  <main class="container">
    <section class="stats-grid" id="stats"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>管理员用户</h2>
      </div>
      <form id="user-form" class="inline-form">
        <input name="username" placeholder="用户名" required>
        <input name="role" placeholder="角色（如：运营）" value="普通管理员">
        <select name="status">
          <option value="启用">启用</option>
          <option value="禁用">禁用</option>
        </select>
        <button>新增用户</button>
      </form>
      <table>
        <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="users-table"></tbody>
      </table>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>商品管理</h2>
      </div>
      <form id="product-form" class="inline-form">
        <input name="name" placeholder="商品名" required>
        <input name="category" placeholder="分类" value="未分类">
        <input name="stock" type="number" placeholder="库存" value="0" min="0">
        <input name="price" type="number" placeholder="价格" value="0" min="0" step="0.01">
        <button>新增商品</button>
      </form>
      <table>
        <thead><tr><th>ID</th><th>商品名</th><th>分类</th><th>库存</th><th>价格</th><th>操作</th></tr></thead>
        <tbody id="products-table"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
